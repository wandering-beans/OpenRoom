name: macOS release build
on:
  workflow_dispatch:
    inputs:
      source_ref:
        description: Application commit to build (defaults to this workflow revision)
        type: string
      dmg_from_release:
        description: Package the ZIP already published at this tag instead of rebuilding (e.g. v0.7.14)
        type: string
      audit_dependencies:
        description: Collect dependency evidence without building
        type: boolean
        default: false
permissions:
  contents: read
jobs:
  build:
    if: ${{ !inputs.dmg_from_release }}
    runs-on: macos-latest
    timeout-minutes: 60
    env:
      HOMEBREW_NO_AUTO_UPDATE: 1
      HOMEBREW_NO_INSTALL_FROM_API: 1
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.source_ref || github.sha }}
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: desktop/package-lock.json
      - uses: dtolnay/rust-toolchain@stable
      - name: Select the Homebrew recipes used for the release inventory
        run: |
          core="$(brew --repository)/Library/Taps/homebrew/homebrew-core"
          mkdir -p "$core"
          if [ ! -d "$core/.git" ]; then
            git -C "$core" init --quiet
            git -C "$core" remote add origin https://github.com/Homebrew/homebrew-core.git
          fi
          git -C "$core" fetch --depth=1 origin 543e7034a78b2d4aa344685f89cffeb15d210ca5
          git -C "$core" checkout --detach FETCH_HEAD
      - run: brew install aom inih jpeg-turbo libheif pkgconf cmake ninja gtkmm3 fftw libiptcdata lensfun exiv2 little-cms2 libomp librsvg fmt libraw
      - run: python3 scripts/audit-macos-dependencies.py
      - uses: actions/upload-artifact@v4
        if: ${{ !cancelled() }}
        with:
          name: macos-dependency-audit
          path: dist/macos-dependency-audit
          if-no-files-found: error
      - run: npm ci --prefix desktop
        if: ${{ !inputs.audit_dependencies }}
      - run: python3 scripts/test-privacy-check.py
        if: ${{ !inputs.audit_dependencies }}
      - run: python3 scripts/test-license-inventory.py
        if: ${{ !inputs.audit_dependencies }}
      - run: python3 scripts/privacy-check.py --tracked
        if: ${{ !inputs.audit_dependencies }}
      - run: sh scripts/build-desktop.sh dist/OpenRoom.app
        if: ${{ !inputs.audit_dependencies }}
      - name: Verify notices and scan the complete app
        if: ${{ !inputs.audit_dependencies }}
        run: |
          for file in LICENSE COPYRIGHT.md DISCLAIMER.md TERMS.md; do
            cmp "$file" "dist/OpenRoom.app/Contents/Resources/licenses/$file"
          done
          python3 scripts/privacy-check.py dist/OpenRoom.app
          codesign --verify --deep --strict dist/OpenRoom.app
          test "$(lipo -archs dist/OpenRoom.app/Contents/MacOS/OpenRoom)" = arm64
          AE_DATA_DIR="$RUNNER_TEMP/openroom-smoke" dist/OpenRoom.app/Contents/MacOS/OpenRoom &
          app_pid=$!
          sleep 10
          kill -0 "$app_pid"
          kill "$app_pid"
      - name: Prepare the macOS update archive for offline signing
        if: ${{ !inputs.audit_dependencies }}
        run: python3 scripts/package-update.py dist/OpenRoom.app --prepare-only --output dist/macos-update
      - uses: actions/upload-artifact@v4
        if: ${{ !inputs.audit_dependencies }}
        with:
          name: macos-update
          path: dist/macos-update/
          if-no-files-found: error
      - name: Package manual download
        if: ${{ !inputs.audit_dependencies }}
        run: |
          version=$(node -p "require('./desktop/package.json').version")
          ditto -c -k --sequesterRsrc --keepParent dist/OpenRoom.app "dist/OpenRoom-$version-macos-arm64.zip"
          shasum -a 256 "dist/OpenRoom-$version-macos-arm64.zip" > dist/MACOS-SHA256SUMS.txt
      - uses: actions/upload-artifact@v4
        if: ${{ !inputs.audit_dependencies }}
        with:
          name: macos-release
          path: |
            dist/OpenRoom-*-macos-arm64.zip
            dist/MACOS-SHA256SUMS.txt
          if-no-files-found: error
  disk-image:
    needs: build
    if: ${{ always() && !cancelled() && !inputs.audit_dependencies && (needs.build.result == 'success' || (needs.build.result == 'skipped' && inputs.dmg_from_release != '')) }}
    runs-on: macos-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        if: ${{ !inputs.dmg_from_release }}
        with:
          name: macos-release
          path: dist
      - name: Download the published ZIP for the requested release
        if: ${{ inputs.dmg_from_release }}
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ inputs.dmg_from_release }}
        run: |
          [[ "$RELEASE_TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]
          file="OpenRoom-${RELEASE_TAG#v}-macos-arm64.zip"
          gh release download "$RELEASE_TAG" --pattern "$file" --pattern SHA256SUMS.txt --dir dist
          awk -v file="$file" '$2 == file { print $1 "  dist/" file; n++ } END { if (n != 1) exit 1 }' dist/SHA256SUMS.txt > dist/MACOS-SHA256SUMS.txt
      - name: Build disk image and test installation through its Applications link
        run: |
          shasum -a 256 -c dist/MACOS-SHA256SUMS.txt
          bash scripts/package-macos-dmg.sh dist/OpenRoom-*-macos-arm64.zip
          mount="$RUNNER_TEMP/openroom-dmg-mount"
          mkdir "$mount"
          hdiutil attach -readonly -nobrowse -mountpoint "$mount" dist/OpenRoom-*-macos-arm64.dmg
          trap 'hdiutil detach "$mount"' EXIT
          test "$(readlink "$mount/Applications")" = /Applications
          test ! -e /Applications/OpenRoom.app
          ditto "$mount/OpenRoom.app" "$mount/Applications/OpenRoom.app"
          codesign --verify --deep --strict /Applications/OpenRoom.app
          AE_DATA_DIR="$RUNNER_TEMP/openroom-dmg-smoke" /Applications/OpenRoom.app/Contents/MacOS/OpenRoom &
          pid=$!
          sleep 10
          kill -0 "$pid"
          kill "$pid"
          (cd dist && shasum -a 256 OpenRoom-*-macos-arm64.dmg > DMG-SHA256SUMS.txt)
      - uses: actions/upload-artifact@v4
        with:
          name: macos-dmg
          path: |
            dist/OpenRoom-*-macos-arm64.dmg
            dist/DMG-SHA256SUMS.txt
          if-no-files-found: error
