[package]
name = "advanced-explorer-desktop"
version = "0.7.8"
edition = "2024"
license = "GPL-3.0-or-later"
build = "build.rs"

[features]
custom-protocol = ["tauri/custom-protocol"]

[dependencies]
tempfile = "3"
advanced-explorer-develop = { path = "../crates/develop-core" }
rayon = "1"
advanced-explorer = { path = ".." }
anyhow = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tauri = { version = "2", features = ["protocol-asset"] }
tauri-plugin-dialog = "2"
tauri-plugin-opener = "2"
image = { version = "0.25", default-features = false, features = ["png", "jpeg"] }
advanced-explorer-media = { path = "../crates/media-core" }
tokio = { version = "1", features = ["sync", "net", "time", "macros"] }
rmcp = { version = "=3.6.0", features = ["transport-streamable-http-server"] }
axum = "0.8"
tokio-util = "0.7"
base64 = "0.22"
rand = "0.9"
subtle = "2"

[target.'cfg(target_os = "macos")'.dependencies]
keyring = { version = "3.6.3", features = ["apple-native"] }

[target.'cfg(target_os = "windows")'.dependencies]
keyring = { version = "3.6.3", features = ["windows-native"] }

[target.'cfg(target_os = "linux")'.dependencies]
keyring = { version = "3.6.3", features = ["sync-secret-service", "crypto-rust", "vendored"] }

[dev-dependencies]
reqwest = { version = "0.13", default-features = false, features = ["json"] }

[build-dependencies]
tauri-build = { version = "2", features = [] }

[profile.release]
lto = "thin"
codegen-units = 1
